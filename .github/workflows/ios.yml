name: iOS

on:
  push:
    branches: [main, native-app]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            echo "Xcode 26 not found" && ls /Applications && exit 1
          fi
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Generate project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Build app
        run: |
          cd ios
          set -o pipefail
          xcodebuild \
            -project PokeFire.xcodeproj \
            -scheme PokeFire \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: Publish build log
        if: always() && github.ref != 'refs/heads/main'
        run: |
          mkdir -p /tmp/ci-log
          if [ -f ios/build.log ]; then
            grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" ios/build.log | sort -u > /tmp/ci-log/errors.txt || true
            tail -n 400 ios/build.log > /tmp/ci-log/tail.txt
          fi
          echo "${{ github.sha }} ${{ job.status }}" > /tmp/ci-log/status.txt
          cd /tmp/ci-log
          git init -q
          git checkout -q -b ci-log
          git add .
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "build log ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-log

      - name: Package IPA
        run: |
          cd ios
          rm -rf Payload PokeFire.ipa
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/PokeFire.app Payload/
          zip -qry PokeFire.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: PokeFire-ipa
          path: ios/PokeFire.ipa
          retention-days: 30
